name: QDB Test Report
description: Generate JUnit HTML reports and publish them to S3/R2
author: https://github.com/bureau14
requirements:
  - python3
configuration:
  properties:
    title:
      type: string
      description: Report title shown in the HTML UI and Buildkite annotation.
    execution_name:
      type: string
      description: Optional top-level execution name.
    project_id:
      type: string
      description: Object-store project namespace; defaults to BUILDKITE_PIPELINE_SLUG.
    only_failures:
      type: boolean
      description: Generate an HTML tree containing only failures/errors while keeping full summary counts. Default false.
    annotate:
      type: boolean
      description: Create Buildkite annotation linking to HTML; default true.
    annotation_report_limit:
      type: integer
      minimum: 1
      default: 20
      description: Maximum report timing rows in each annotation, sorted slowest first. Reports below one second and CTest wrapper executions are excluded.
    debug:
      type: boolean
      description: Enable bash debug tracing.
    log_level:
      type: string
      enum: [debug, info, warning, error, fatal]
      default: error
      description: Minimum message severity; defaults to quiet output (error and fatal only). Use info for progress or debug for per-file details.
    upload_parallel:
      type: integer
      minimum: 1
      description: Maximum concurrent file uploads with one reused client per worker. Defaults to the agent's logical CPU count; use 1 for serial uploads.
    job:
      type: object
      description: Per-job report and raw JUnit XML upload configuration.
      properties:
        variant:
          type: string
          description: Test variant name and report grouping.
        junit_input_path:
          type: string
          description: Local JUnit XML file, directory, or glob.
        manifest_input_path:
          type: string
          description: Optional version 1 launcher manifests (file, directory, or glob), with explicit report and artifact associations.
        fail_on_test_failures:
          type: boolean
          description: Exit 64 for failed or errored tests or malformed JUnit XML (legacy or manifest-owned); default true. When false, report these errors without failing the step.
        artifacts:
          type: array
          description: Optional additional files to upload with the job report and link from HTML.
          items:
            type: object
            properties:
              name:
                type: string
                description: Human-readable artifact group name shown in the report.
              input_path:
                type: string
                description: Local file, directory, or glob to upload.
            required: [name, input_path]
            additionalProperties: false
      required: [variant]
      anyOf:
        - required: [junit_input_path]
        - required: [manifest_input_path]
      additionalProperties: false
    aggregate:
      type: object
      description: Aggregate report configuration that discovers raw XML uploaded by job reports for the current build.
      properties:
        parse_workers:
          type: integer
          minimum: 1
          description: Maximum XML parsing processes. Defaults to the logical CPU count (at most 61 on Windows); use 1 for serial parsing.
        download_parallel:
          type: integer
          description: Maximum concurrent aggregate XML and job-summary downloads. Default 32.
        download_concurrency:
          type: integer
          description: Per-file boto3 transfer concurrency for aggregate XML downloads. Default 4.
      additionalProperties: false
  required: [title]
  additionalProperties: false
  oneOf:
    - required: [job]
      not:
        required: [aggregate]
    - required: [aggregate]
      not:
        required: [job]
