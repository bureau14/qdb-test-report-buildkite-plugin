name: QDB Test Report
description: Generate JUnit HTML reports and publish them to S3/R2
author: https://github.com/bureau14
requirements:
  - python3
configuration:
  properties:
    scope:
      type: string
      enum: [job, full]
      description: Whether this is a fast per-job report or aggregate full report
    title:
      type: string
      description: Report title shown in the HTML UI
    variant:
      type: string
      description: Platform/configuration key. Required for scope=job; optional for per-variant full reports.
    execution_name:
      type: string
      description: Optional top-level execution name
    project_id:
      type: string
      description: Object-store project namespace; defaults to BUILDKITE_PIPELINE_SLUG
    platforms:
      type: array
      minItems: 1
      items:
        type: object
        properties:
          name:
            type: string
          path:
            type: string
        required: [name, path]
    only_failures:
      type: boolean
      description: Generate a faster large-report HTML tree containing only failures/errors while keeping full summary counts
    annotate:
      type: boolean
      description: Create Buildkite annotation linking to HTML; default true
    fail_on_test_failures:
      type: boolean
      description: Exit 64 when the generated report contains failed or errored tests; default true for job reports and false for full reports
    debug:
      type: boolean
      description: Enable bash debug tracing
  required: [scope, title, platforms]
  additionalProperties: false
