agents:
  queue: "default-debian-amd64"

steps:
  - label: "Lint code (Ruff)"
    command: |
      pip install ruff==0.16.0
      # linting check
      ruff check .
      # formatting check
      ruff format --check .
    plugins:
      - docker#v5.13.0:
          image: "python:3.14-slim"
          chown: true

  - label: "Tests (Python 3.7)"
    command: |
      pip install pytest==7.4.4 boto3==1.33.13
      python -m pytest -q
    plugins:
      - docker#v5.13.0:
          image: "python:3.7-slim"
          chown: true
